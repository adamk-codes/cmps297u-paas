# Security evidence: run with one app's login and prove it cannot open another app's database.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels: &labels
    app.kubernetes.io/part-of: rebound
    rebound.io/kind: isolation-check
    rebound.io/app: ${APP_NAME}
    rebound.io/operation-id: ${OPERATION_ID}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: *labels
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: isolation-check
          image: ${JOBS_IMAGE}
          args: ["isolation-check"]
          env:
            - { name: OTHER_DATABASE, value: "${OTHER_DATABASE}" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: "${APP_NAME}-db", key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
