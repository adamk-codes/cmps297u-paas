# Identity for the data jobs. On EKS the annotation maps it to an IAM role (IRSA) that may only
# read/write the backup bucket, use the backup KMS key, and manage rebound/apps/* secrets
# (see iam-policy.json). No AWS keys are stored in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rebound-data-jobs
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: rebound
    app.kubernetes.io/component: data-jobs
  annotations:
    eks.amazonaws.com/role-arn: ${DATA_JOBS_ROLE_ARN}
